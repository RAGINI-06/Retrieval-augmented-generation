[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RAGINI-06", email = "nragini733@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
